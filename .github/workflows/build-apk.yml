name: Android build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release after the signed build
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example v1.0.1)
        required: false
        type: string
        default: v1.0.0

permissions:
  contents: read

jobs:
  build:
    name: Verify and build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests and lint
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/unit-tests-and-lint.log"
          gradle :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee "$log_file"
          gradle_status=${PIPESTATUS[0]}
          if [[ "$gradle_status" -ne 0 ]]; then
            mapfile -t diagnostic_lines < <(
              {
                grep -Ei '^(e: |error:|.*(unresolved reference|type mismatch|no value passed|cannot find|could not resolve|could not find|lint found|failing tests?|expected:|actual:))' "$log_file" | head -n 5 || true
                grep -Ei '^(FAILURE:|.*What went wrong:|Execution failed for task|Caused by:|BUILD FAILED|.*tests? (completed|failed)|.*there were failing tests.*|> )' "$log_file" | grep -v '^> Task ' | tail -n 5 || true
              } | awk '!seen[$0]++'
            )
            if [[ "${#diagnostic_lines[@]}" -eq 0 ]]; then
              mapfile -t diagnostic_lines < <(tail -n 10 "$log_file")
            fi
            {
              echo "### Gradle test/lint diagnostics"
              echo '```text'
              printf '%s\n' "${diagnostic_lines[@]}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for line in "${diagnostic_lines[@]}"; do
              escaped="${line//'%'/'%25'}"
              echo "::error title=Gradle test/lint diagnostic::$escaped"
            done
          fi
          exit "$gradle_status"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/safeplayer-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing. Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD in GitHub Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p output-apks
          cp app/build/outputs/apk/debug/app-debug.apk output-apks/SafePlayer-debug.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk output-apks/SafePlayer-release.apk
          fi
          ls -lh output-apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafePlayer-APKs
          path: output-apks/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish signed GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APKs
        uses: actions/download-artifact@v4
        with:
          name: SafePlayer-APKs
          path: output-apks

      - name: Verify signed release APK exists
        run: test -s output-apks/SafePlayer-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: SafePlayer ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            SafePlayer Android build from the verified source branch.

            Release APK: `SafePlayer-release.apk`
            Debug APK: `SafePlayer-debug.apk`
          files: output-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
