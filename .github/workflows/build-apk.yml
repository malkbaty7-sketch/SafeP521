name: Android build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release after the signed build
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example v1.0.1)
        required: false
        type: string
        default: v1.0.0

permissions:
  contents: read

# A push to a branch with an open PR triggers both events. Share one concurrency
# group so PR validation supersedes a duplicate push run without the reverse.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Verify and build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          problem-matcher: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Run unit tests and lint
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/unit-tests-and-lint.log"
          GRADLE_LOG_FILE="$log_file" ./scripts/gradle-with-retries.sh :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
          gradle_status=$?
          if [[ "$gradle_status" -ne 0 ]]; then
            python3 - <<'PY'
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          def compact(value, limit=320):
              return " ".join((value or "").split())[:limit]

          def emit(title, lines):
              if not lines:
                  return
              message = "\n".join(lines)
              if len(message) > 3_500:
                  message = message[:3_500] + "\n... (truncated)"
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{escaped}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"### {title}\n```text\n{message}\n```\n")

          log_path = Path(os.environ["RUNNER_TEMP"]) / "unit-tests-and-lint.log"
          log_lines = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []
          compile_errors = [line.strip() for line in log_lines if re.match(r"^(e: |error:)", line, re.IGNORECASE)]
          build_summary = [
              line.strip() for line in log_lines
              if re.search(r"FAILURE:|What went wrong:|Execution failed for task|BUILD FAILED|Lint found|There were failing tests|Caused by:", line, re.IGNORECASE)
          ]
          emit("Gradle compilation/build diagnostics", (compile_errors[:8] + build_summary[-5:])[:12])

          test_failures = []
          for report in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for result in case:
                      if result.tag not in ("failure", "error"):
                          continue
                      detail = compact(result.attrib.get("message"))
                      raw_stack = result.text or ""
                      suppressed = re.search(r"(?m)^\s*Suppressed:", raw_stack)
                      stack_source = raw_stack[suppressed.start():] if suppressed else raw_stack
                      stack = compact(stack_source, limit=1_250)
                      if stack and stack not in detail:
                          detail = f"{detail} | stack: {stack}" if detail else stack
                      test_failures.append(f"{case.get('classname', 'test')}#{case.get('name', 'unknown')}: {detail or result.tag}")
          emit("Unit test failures", [f"{len(test_failures)} failing test(s):", *test_failures[:12]] if test_failures else [])

          lint_errors = []
          seen = set()
          for report in Path("app/build").rglob("lint-results*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for issue in root.iter("issue"):
                  if issue.attrib.get("severity", "").lower() != "error":
                      continue
                  location = issue.find("location")
                  filename = location.attrib.get("file", "unknown") if location is not None else "unknown"
                  line = location.attrib.get("line", "?") if location is not None else "?"
                  identifier = issue.attrib.get("id", "LintError")
                  message = compact(issue.attrib.get("message"))
                  entry = (identifier, filename, line, message)
                  if entry not in seen:
                      seen.add(entry)
                      lint_errors.append(entry)
          if lint_errors:
              counts = Counter(item[0] for item in lint_errors)
              lint_lines = [f"{len(lint_errors)} lint error(s); issue counts:"]
              lint_lines.extend(f"{identifier}: {count}" for identifier, count in sorted(counts.items()))
              lint_lines.append("Examples:")
              lint_lines.extend(f"{identifier} {filename}:{line}: {message}" for identifier, filename, line, message in lint_errors[:8])
              emit("Android lint errors", lint_lines)
          PY
          fi
          exit "$gradle_status"

      - name: Build debug APK
        run: ./scripts/gradle-with-retries.sh :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/safeplayer-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing. Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD in GitHub Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          ./scripts/gradle-with-retries.sh :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p output-apks
          cp app/build/outputs/apk/debug/app-debug.apk output-apks/SafePlayer-debug.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk output-apks/SafePlayer-release.apk
          fi
          ls -lh output-apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SafePlayer-APKs
          path: output-apks/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish signed GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APKs
        uses: actions/download-artifact@v8
        with:
          name: SafePlayer-APKs
          path: output-apks

      - name: Verify signed release APK exists
        run: test -s output-apks/SafePlayer-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: SafePlayer ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            SafePlayer Android build from the verified source branch.

            Release APK: `SafePlayer-release.apk`
            Debug APK: `SafePlayer-debug.apk`
          files: output-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
